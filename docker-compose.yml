# I.N.A.Y.A.T. — share with Docker Compose (not Kubernetes).
#
# 1. Copy .env.example → .env and add your Gemini / Mem0 / Aura keys.
# 2. SPA (default):        docker compose up --build
#    → http://localhost:8000
# 3. Streamlit (optional): docker compose --profile streamlit up --build
#    → http://localhost:8501
#
# Cloud APIs stay outside the container. Python is not required on the host.

services:
  inayat-spa:
    build:
      context: .
      dockerfile: Dockerfile.spa
    container_name: inayat_spa
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  inayat-streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inayat_agent
    profiles: ["streamlit"]
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
